[package]
name = "defect-tauri"
version = "0.1.0"
description = "DefectDetection Tauri app"
authors = ["BKVision"]
edition = "2021"

[lib]
name = "defect_tauri"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
